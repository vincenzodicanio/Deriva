<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#455a64">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Deriva paracadutista</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1d2a31;--mut:#6b7a83;--acc:#455a64;--line:#d9dfe3;--warn:#fff1de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:2px}
button{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px}
#calc{width:100%;margin-top:12px;font-size:18px}
#res{font-size:15px}
table{width:100%;border-collapse:collapse}
td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
td small{display:block;color:var(--mut)}
td:nth-child(2){text-align:center;font-size:18px}td:nth-child(3){text-align:right;font-size:18px}
tr.zc td{background:var(--warn)}
#map{height:420px;border-radius:14px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;color:var(--mut);font-size:14px}
.et{background:#fff;border:0;box-shadow:0 1px 4px #0005;font-weight:600}
</style>
</head>
<body>
<div class="card">
<h1>Deriva paracadutista</h1>
<div class="g">
<label>Atterraggio · latitudine<input id="lat" inputmode="decimal"></label>
<label>Atterraggio · longitudine<input id="lon" inputmode="decimal"></label>
<label>Quota di lancio (ft AGL)<input id="lancio" type="number" value="13000"></label>
<label>Quota di apertura (ft AGL)<input id="apertura" type="number" value="4900"></label>
<label>Discesa sotto vela (m/s)<input id="vela" type="number" step="0.1" value="5"></label>
<label>Efficienza (3 = 3:1, 0 = tondo)<input id="eff" type="number" step="0.1" value="0"></label>
<label>Caduta libera (m/s)<input id="free" type="number" value="50"></label>
<label>Ore al lancio<input id="ore" type="number" step="0.5" value="0"></label>
<label style="grid-column:span 2">Taratura Cypres Mil · QFE sulla verticale dell'apertura (hPa)<input id="qfe" inputmode="decimal" placeholder="si compila dopo il calcolo"></label>
</div>
<button id="calc">Calcola punto di uscita</button>
</div>

<div class="card" id="res" hidden></div>
<div class="card" id="tab" hidden></div>

<div class="bar"><button id="gps">📍 La mia posizione</button><span id="gpsst">GPS non attivo</span></div>
<div id="map"></div>

<script type="module">
import { calcolaPuntoUscita } from "./calcolo.js";
const $ = (id) => document.getElementById(id);
const FT = 0.3048, R = 6371000;

// ---- mappa e GPS ----
const map = L.map("map").setView([43.8, 10.6], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);
let me = null, mePos = null;
map.on("click", (e) => { $("lat").value = e.latlng.lat.toFixed(5); $("lon").value = e.latlng.lng.toFixed(5); });

function avviaGps() {
  if (!navigator.geolocation) { $("gpsst").textContent = "GPS non supportato"; return; }
  navigator.geolocation.watchPosition((p) => {
    mePos = [p.coords.latitude, p.coords.longitude];
    if (!me) {
      me = L.circleMarker(mePos, { radius: 8, color: "#fff", weight: 3, fillColor: "#1976d2", fillOpacity: 1 }).addTo(map);
      if (!$("lat").value) { $("lat").value = mePos[0].toFixed(5); $("lon").value = mePos[1].toFixed(5); }
      map.setView(mePos, 13);
    } else me.setLatLng(mePos);
    $("gpsst").textContent = `GPS attivo · precisione ±${Math.round(p.coords.accuracy)} m`;
  }, (e) => { $("gpsst").textContent = "GPS non disponibile: " + e.message; }, { enableHighAccuracy: true });
}
$("gps").onclick = () => (mePos ? map.setView(mePos, 15) : avviaGps());
avviaGps();

// ---- meteo (Open-Meteo, gratuito) ----
const PL = [1000, 975, 950, 925, 900, 850, 800, 700, 600, 500];
async function meteo(lat, lon, ore) {
  const v = ["wind_speed_10m", "wind_direction_10m", "surface_pressure"];
  PL.forEach((p) => v.push(`wind_speed_${p}hPa`, `wind_direction_${p}hPa`, `geopotential_height_${p}hPa`));
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=${v.join(",")}&wind_speed_unit=kn&timeformat=unixtime&forecast_days=3`;
  let j;
  try { j = await (await fetch(url)).json(); localStorage.setItem("meteo", JSON.stringify(j)); }
  catch { j = JSON.parse(localStorage.getItem("meteo") || "null"); if (!j) throw new Error("Meteo non disponibile: serve la connessione"); }
  const target = Date.now() / 1000 + ore * 3600;
  let i = 0;
  j.hourly.time.forEach((t, k) => { if (Math.abs(t - target) < Math.abs(j.hourly.time[i] - target)) i = k; });
  const H = j.hourly, pts = [];
  const add = (h, d, k) => { if (d != null && k != null) pts.push({ h, e: -k * Math.sin(d * Math.PI / 180), n: -k * Math.cos(d * Math.PI / 180) }); };
  add(33, H.wind_direction_10m[i], H.wind_speed_10m[i]);
  PL.forEach((p) => {
    const g = H[`geopotential_height_${p}hPa`][i];
    if (g == null) return;
    const h = (g - j.elevation) / FT;
    if (h > 100) add(h, H[`wind_direction_${p}hPa`][i], H[`wind_speed_${p}hPa`][i]);
  });
  pts.sort((a, b) => a.h - b.h);
  return { pts, elev: j.elevation, qfe: H.surface_pressure[i] };
}
async function qfeA(lat, lon, ore) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=surface_pressure&timeformat=unixtime&forecast_days=3`;
  const j = await (await fetch(url)).json();
  const target = Date.now() / 1000 + ore * 3600;
  let i = 0;
  j.hourly.time.forEach((t, k) => { if (Math.abs(t - target) < Math.abs(j.hourly.time[i] - target)) i = k; });
  return j.hourly.surface_pressure[i];
}
function ventoA(P, h) {
  if (h <= P[0].h) return P[0];
  if (h >= P[P.length - 1].h) return P[P.length - 1];
  const k = P.findIndex((x) => x.h >= h), a = P[k - 1], b = P[k], t = (h - a.h) / (b.h - a.h);
  return { e: a.e + t * (b.e - a.e), n: a.n + t * (b.n - a.n) };
}

// ---- calcolo e disegno ----
$("qfe").oninput = () => ($("qfe").dataset.man = 1);
$("calc").onclick = async () => {
  const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
  const res = $("res");
  res.hidden = false;
  if (isNaN(lat) || isNaN(lon)) { res.textContent = "Inserisci le coordinate dell'atterraggio o tocca la mappa."; return; }
  const lancio = +$("lancio").value, apertura = +$("apertura").value;
  if (apertura >= lancio) { res.textContent = "La quota di apertura deve essere più bassa di quella di lancio."; return; }
  res.textContent = "Scarico il meteo…";
  let m;
  try { m = await meteo(lat, lon, +$("ore").value); } catch (e) { res.textContent = e.message; return; }

  const quote = new Set([lancio, apertura, 0]);
  for (let q = 1000; q < lancio; q += 1000) quote.add(q);
  const venti = [...quote].sort((a, b) => b - a).map((q) => {
    const w = ventoA(m.pts, q), kt = Math.hypot(w.e, w.n);
    return { quotaFt: q, dirDa: (Math.atan2(-w.e, -w.n) * 180 / Math.PI + 360) % 360, kt };
  });

  const r = calcolaPuntoUscita({
    latAtterraggio: lat, lonAtterraggio: lon, quotaLancioFt: lancio, quotaAperturaFt: apertura,
    rateoCadutaLibera: +$("free").value, rateoVela: +$("vela").value, efficienza: +$("eff").value, venti,
  });

  // tabella venti
  const zq = r.zampeDiCane.map((z) => z.quotaFt);
  $("tab").hidden = false;
  $("tab").innerHTML = "<table>" + venti.map((v) => `<tr class="${zq.includes(v.quotaFt) ? "zc" : ""}">
    <td>${v.quotaFt} ft AGL<small>${Math.round(m.elev + v.quotaFt * FT)} m AMSL${v.quotaFt === apertura ? " · apertura" : ""}${v.quotaFt === lancio ? " · lancio" : ""}</small></td>
    <td>${String(Math.round(v.dirDa) % 360).padStart(3, "0")}°</td>
    <td>${Math.round(v.kt)} kt<small>${(v.kt * 0.5144).toFixed(1)} m/s</small></td></tr>`).join("") + "</table>";

  // mappa
  layer.clearLayers();
  const pt = (p, col, fill, label) => {
    const c = L.circleMarker([p.lat, p.lon], { radius: 9, weight: 4, color: col, fillColor: fill, fillOpacity: 1 }).addTo(layer);
    if (label) c.bindTooltip(label, { permanent: true, direction: "left", className: "et" });
  };
  r.tratti.forEach((t) => L.polyline([[t.da.lat, t.da.lon], [t.a.lat, t.a.lon]], { color: t.tipo === "caduta" ? "#1b8a1b" : "#0000ff", weight: 6 }).addTo(layer));
  pt(r.atterraggio, "#000", "#f00");
  r.zampeDiCane.forEach((z) => pt(z, "#000", "#ffa000", `Zampa di cane ${z.quotaFt} ft`));
  if (r.apertura) pt(r.apertura, "#000", "#fff");
  pt(r.uscita, "#000", "#1b8a1b", "USCITA");
  map.fitBounds(L.latLngBounds([r.uscita, r.atterraggio, ...(r.apertura ? [r.apertura] : [])].map((p) => [p.lat, p.lon])).pad(0.3));

  // QFE sulla verticale del punto di apertura
  let q = null;
  if (r.apertura) {
    try { q = await qfeA(r.apertura.lat, r.apertura.lon, +$("ore").value); } catch {}
    if (q != null && !$("qfe").dataset.man) $("qfe").value = q.toFixed(1);
  }

  // riepilogo
  const dN = (r.uscita.lat - lat) * Math.PI / 180 * R, dE = (r.uscita.lon - lon) * Math.PI / 180 * R * Math.cos(lat * Math.PI / 180);
  const dist = Math.hypot(dE, dN), brg = (Math.atan2(dE, dN) * 180 / Math.PI + 360) % 360;
  res.innerHTML = `<b>Uscita</b> ${r.uscita.lat.toFixed(5)}, ${r.uscita.lon.toFixed(5)}<br>${Math.round(dist)} m dall'atterraggio, direzione ${Math.round(brg)}° (da dove viene il vento)` +
    (q != null ? `<br><b>QFE Cypres</b> ${q.toFixed(1)} hPa sulla verticale dell'apertura` : "<br>QFE non disponibile: serve la connessione.") +
    (r.zampeDiCane.length ? `<br>⚠ Zampa di cane a ${zq.join(", ")} ft: il vento cambia di 90° o più.` : "");
};
</script>
<script src="registra-sw.js"></script>
</body>
</html>
